<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM-001 - Tela de Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Segoe UI",Arial,sans-serif;color:#fff}
body{overflow:hidden;background:#0d0520}
.bg{position:fixed;inset:0;background:linear-gradient(105deg,#0d0520 0% 45%,rgba(21,10,40,.95) 100%)}
.bg::after{content:"";position:absolute;inset:0;background:url("https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1400") center/cover;opacity:.2}
.lay{position:relative;z-index:1;display:flex;height:100vh;max-width:1100px;margin:0 auto}
.L{flex:1;padding:8vh 6vw;display:flex;flex-direction:column;justify-content:center}
.logo{font-size:48px;font-weight:900}
.tag{font-size:12px;letter-spacing:4px;margin-top:4px}
.tit{margin-top:10vh;font-size:clamp(2rem,5vw,3.2rem);font-weight:800;font-style:italic;text-shadow:3px 3px #000}
.ban{display:inline-block;margin-top:28px;padding:12px 32px;background:#d4c4a0;color:#4a3c20;font-weight:800;font-size:28px;transform:skewX(-6deg)}
.R{width:400px;padding:8vh 40px;background:rgba(21,10,40,.9);margin-left:auto;display:flex;flex-direction:column;justify-content:center}
.br{margin-bottom:36px;font-size:18px;letter-spacing:.1em}
.br span{color:#b026ff;font-weight:700}
.fd{margin-bottom:22px}
.fd label{font-size:11px;color:#aaa;letter-spacing:2px}
.ln{height:2px;background:#9b30ff;margin:6px 0}
.vl{font-size:15px;color:#ddd}
.btn{margin-top:12px;padding:14px;width:100%;border:0;background:#b026ff;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.hint{margin-top:14px;font-size:11px;color:#888;line-height:1.4}
.top{position:fixed;top:0;left:0;right:0;z-index:9;background:#1a3a1a;padding:8px;text-align:center;font-size:13px}
.mdl{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);align-items:center;justify-content:center}
.mdl.on{display:flex}
.bx{background:#333;border:2px solid #666;width:340px;color:#fff}
.bx h3{margin:0;padding:10px;background:#1e3a5f;font-size:14px}
.bx input{width:calc(100% - 24px);padding:10px;margin:12px;background:#111;border:1px solid #555;color:#fff}
.bx .ft{padding:10px;text-align:right}
.bx button{margin-left:8px;padding:8px 14px;cursor:pointer}
#fs{cursor:pointer}
</style>
</head>
<body>
<div class="top">Preview - clique SENHA, digite, depois LOGAR</div>
<div class="bg"></div>
<div class="lay">
<div class="L">
<div class="logo">LS</div>
<div class="tag">GM-001</div>
<div class="tit">TELA DE LOGIN</div>
<div class="ban">SAMP</div>
</div>
<div class="R">
<div class="br">| <span>GM</span>-001 |</div>
<div class="fd"><label>LOGIN</label><div class="ln"></div><div class="vl">SeuNick</div></div>
<div class="fd" id="fs"><label>SENHA</label><div class="ln"></div><div class="vl" id="sv">Clique para digitar</div></div>
<button type="button" class="btn" id="lg">LOGAR</button>
<p class="hint">No jogo: clique SENHA no TextDraw, depois LOGAR.</p>
</div>
</div>
<div class="mdl" id="m">
<div class="bx">
<h3>Senha</h3>
<input type="password" id="i" placeholder="Minimo 4 caracteres">
<div class="ft"><button type="button" id="o">OK</button><button type="button" id="c">Voltar</button></div>
</div>
</div>
<script>
var s="";
document.getElementById("fs").onclick=function(){document.getElementById("m").className="mdl on";document.getElementById("i").focus();};
document.getElementById("c").onclick=function(){document.getElementById("m").className="mdl";};
document.getElementById("o").onclick=function(){
var v=document.getElementById("i").value;
if(v.length<4){alert("[Login] Senha invalida.");return;}
s=v;document.getElementById("sv").textContent="********";
document.getElementById("m").className="mdl";
};
document.getElementById("lg").onclick=function(){
if(s.length<4){alert("[Login] Clique em SENHA primeiro.");return;}
alert("[Login] Bem-vindo! Simulacao.");
};
</script>
</body>
</html>
