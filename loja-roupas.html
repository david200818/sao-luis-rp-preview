<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STREET - Loja de Roupas | Sao Luis RP</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Inter, "Segoe UI", sans-serif; color: #fff; }

    .scene {
      position: fixed; inset: 0;
      background: #2a2420 url("img/loja-bg.png") center/cover no-repeat;
    }
    .scene::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,.7) 100%);
      pointer-events: none;
    }

    .graffiti {
      position: fixed; right: 8%; top: 18%;
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(4rem, 12vw, 9rem);
      color: #fff;
      -webkit-text-stroke: 3px #000;
      text-shadow: 4px 4px 0 #e63946, 8px 8px 0 #000;
      transform: rotate(-4deg);
      opacity: 0.15;
      pointer-events: none;
      z-index: 1;
      letter-spacing: 0.08em;
    }

    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      padding: 10px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,.9), transparent);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px;
    }
    .top .brand {
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.5rem;
      color: #e63946;
      letter-spacing: 0.12em;
    }
    .top a { color: #aaa; text-decoration: none; }
    .top a:hover { color: #fff; }

    .panel {
      position: absolute; left: 20px; top: 72px; bottom: 48px;
      width: 260px; z-index: 10;
      background: rgba(18, 18, 18, 0.92);
      border: 2px solid #e63946;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
      display: flex; flex-direction: column;
    }
    .panel-head {
      background: #e63946;
      color: #fff;
      padding: 12px 14px;
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.1em;
    }
    .panel-head span { float: right; font-family: Inter; font-size: 11px; font-weight: 600; margin-top: 4px; }
    .cat { padding: 10px 14px 6px; font-size: 10px; color: #e63946; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .list { flex: 1; overflow-y: auto; list-style: none; }
    .list li {
      padding: 10px 14px; font-size: 12px; color: #bbb;
      cursor: pointer; border-left: 3px solid transparent;
      line-height: 1.35;
    }
    .list li small { display: block; color: #666; font-size: 10px; margin-top: 2px; }
    .list li.active {
      background: rgba(230, 57, 70, 0.25);
      color: #fff; border-left-color: #e63946; font-weight: 600;
    }
    .list li:hover:not(.active) { background: rgba(255,255,255,.06); color: #fff; }
    .tab {
      margin: 10px; padding: 10px;
      border: 2px solid #e63946; background: transparent;
      color: #e63946; cursor: pointer;
      font-family: "Bebas Neue", sans-serif; font-size: 1rem; letter-spacing: 0.08em;
    }
    .tab:hover { background: #e63946; color: #fff; }

    .preview-box {
      position: absolute; right: 20px; top: 72px; bottom: 48px;
      width: min(380px, 42vw); z-index: 10;
      background: rgba(12, 12, 12, 0.94);
      border: 2px solid #333;
      border-top: 4px solid #e63946;
      border-radius: 4px;
      display: flex; flex-direction: column;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.7);
    }
    .preview-box .lbl {
      font-size: 10px; color: #e63946; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
    }
    .preview-box .name {
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.75rem; letter-spacing: 0.04em;
      margin: 4px 0 2px; line-height: 1.1;
    }
    .preview-box .meta { font-size: 11px; color: #888; margin-bottom: 10px; }
    .preview-box .meta code { color: #ccc; background: #222; padding: 2px 6px; border-radius: 3px; }

    .outfit-photo-wrap {
      flex: 1; min-height: 200px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
      border: 1px solid #333;
      border-radius: 4px;
      display: flex; align-items: flex-end; justify-content: center;
      overflow: hidden; position: relative;
    }
    .outfit-photo-wrap::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center bottom, rgba(230,57,70,.15), transparent 70%);
    }
    .outfit-photo-wrap img {
      max-height: 100%; max-width: 100%;
      object-fit: contain; object-position: center bottom;
      opacity: 0; transition: opacity .35s;
      position: relative; z-index: 1;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.8));
    }
    .outfit-photo-wrap img.show { opacity: 1; }
    .loading {
      position: absolute; z-index: 2;
      font-size: 11px; color: #666;
    }
    .photo-hint {
      font-size: 10px; color: #555; margin: 10px 0;
      line-height: 1.4;
    }
    .photo-hint a { color: #e63946; }
    .confirm {
      width: 100%; padding: 14px;
      background: #e63946; border: 0;
      color: #fff; font-family: "Bebas Neue", sans-serif;
      font-size: 1.2rem; letter-spacing: 0.12em;
      cursor: pointer; border-radius: 4px;
    }
    .confirm:hover { background: #ff4d5a; }

    .hints {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 20; font-size: 11px; color: rgba(255,255,255,.45);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene"></div>
  <div class="graffiti">STREET</div>

  <header class="top">
    <span class="brand">SAO LUIS RP</span>
    <span id="topBar">Loja de roupas</span>
    <a href="https://open.mp/pt-BR/docs/scripting/resources/skins" target="_blank" rel="noopener">Skins open.mp</a>
  </header>

  <aside class="panel">
    <div class="panel-head">ROUPAS <span id="counter">1/8</span></div>
    <div class="cat" id="catName">STREET / RUA</div>
    <ul class="list" id="list"></ul>
    <button type="button" class="tab" id="tabBtn">TAB — PROXIMA CATEGORIA</button>
  </aside>

  <section class="preview-box">
    <div class="lbl">Preview da skin</div>
    <div class="name" id="selName">—</div>
    <p class="meta">ID <code id="selId">0</code> · modelo <code id="selModel">—</code></p>
    <div class="outfit-photo-wrap" id="photoWrap">
      <span class="loading" id="photoLoad">Carregando...</span>
      <img id="outfitImg" alt="Skin GTA SA" referrerpolicy="no-referrer">
    </div>
    <p class="photo-hint">
      Imagem oficial: <a id="imgLink" href="#" target="_blank" rel="noopener">assets.open.mp</a>
      · <a href="https://open.mp/pt-BR/docs/scripting/resources/skins" target="_blank" rel="noopener">lista completa</a>
    </p>
    <button type="button" class="confirm" id="confirm">X CONFIRMAR ROUPA</button>
  </section>

  <p class="hints">Setas ↑↓ trocar roupa · TAB categoria · Fonte: open.mp</p>

  <script>
  (function () {
    var OPENMP_SKIN_IMG = "https://assets.open.mp/assets/images/skins/";

    /* Categorias com IDs e nomes da documentacao open.mp */
    var SLRP_CATS = [
      {
        n: "STREET / RUA",
        items: [
          { id: 28, model: "bmydrug", name: "Traficante (Los Santos)" },
          { id: 29, model: "wmydrug", name: "Traficante (San Fierro)" },
          { id: 105, model: "fam1", name: "Grove Street Families" },
          { id: 106, model: "fam2", name: "Grove Street Families 2" },
          { id: 107, model: "fam3", name: "Grove Street Families 3" },
          { id: 108, model: "lsv1", name: "Los Santos Vagos" },
          { id: 109, model: "lsv2", name: "Los Santos Vagos 2" },
          { id: 110, model: "lsv3", name: "Los Santos Vagos 3" },
          { id: 173, model: "sfr1", name: "San Fierro Rifa" },
          { id: 174, model: "sfr2", name: "San Fierro Rifa 2" },
          { id: 175, model: "sfr3", name: "San Fierro Rifa 3" },
          { id: 181, model: "vwmycr", name: "Punk" }
        ]
      },
      {
        n: "CASUAL",
        items: [
          { id: 26, model: "wmybp", name: "Mochileiro" },
          { id: 21, model: "bmycr", name: "Pedestre" },
          { id: 22, model: "bmyst", name: "Pedestre 2" },
          { id: 23, model: "wmybmx", name: "BMX" },
          { id: 101, model: "wmyst", name: "Pedestre 3" },
          { id: 154, model: "wmybe", name: "Praia" },
          { id: 188, model: "swmyst", name: "Pedestre 4" },
          { id: 217, model: "wmyclot", name: "Loja de roupas" }
        ]
      },
      {
        n: "FEMININO",
        items: [
          { id: 55, model: "ofyri", name: "Pedestre" },
          { id: 56, model: "ofyst", name: "Pedestre 2" },
          { id: 93, model: "wfyst", name: "Pedestre 3" },
          { id: 138, model: "wfybe", name: "Praia" },
          { id: 211, model: "wfyclot", name: "Loja de roupas" },
          { id: 251, model: "wfylg", name: "Salva-vidas" }
        ]
      },
      {
        n: "TRABALHO",
        items: [
          { id: 16, model: "bmyap", name: "Aeroporto (ground)" },
          { id: 50, model: "wmymech", name: "Mecanico" },
          { id: 156, model: "bmobar", name: "Barbeiro" },
          { id: 177, model: "wmybar", name: "Barbeiro 2" },
          { id: 280, model: "lapd1", name: "Policial Los Santos" },
          { id: 281, model: "sfpd1", name: "Policial San Fierro" },
          { id: 286, model: "fbi", name: "FBI" },
          { id: 287, model: "army", name: "Exercito" }
        ]
      }
    ];

    function skinImageUrl(id) {
      return OPENMP_SKIN_IMG + id + ".png";
    }

    var loadToken = 0;
    function loadOutfitImage(item) {
      var img = document.getElementById("outfitImg");
      var loadTxt = document.getElementById("photoLoad");
      var url = skinImageUrl(item.id);
      var token = ++loadToken;

      document.getElementById("imgLink").href = url;

      img.classList.remove("show");
      loadTxt.style.display = "block";
      loadTxt.textContent = "Carregando skin " + item.id + "...";

      var probe = new Image();
      probe.referrerPolicy = "no-referrer";
      probe.onload = function () {
        if (token !== loadToken) return;
        img.src = url;
        img.classList.add("show");
        loadTxt.style.display = "none";
      };
      probe.onerror = function () {
        if (token !== loadToken) return;
        loadTxt.textContent = "Erro ao carregar. Abra a lista open.mp.";
        img.classList.remove("show");
      };
      probe.src = url;
    }

    var acc = null;
    try { acc = sessionStorage.getItem("slrp_new_account"); } catch (e) {}
    if (!acc) {
      window.location.replace("saoluis-login.html");
      return;
    }
    document.getElementById("topBar").textContent = "Conta: " + acc;

    var cat = 0, idx = 0;

    function current() {
      return SLRP_CATS[cat].items[idx];
    }

    function render() {
      var c = SLRP_CATS[cat];
      var item = c.items[idx];
      document.getElementById("catName").textContent = c.n;
      document.getElementById("counter").textContent = (idx + 1) + "/" + c.items.length;
      document.getElementById("selName").textContent = item.name;
      document.getElementById("selId").textContent = item.id;
      document.getElementById("selModel").textContent = item.model;

      loadOutfitImage(item);

      var list = document.getElementById("list");
      list.innerHTML = "";
      for (var j = 0; j < c.items.length; j++) {
        var li = document.createElement("li");
        var it = c.items[j];
        li.innerHTML = (j === idx ? "▶ " : "") + it.name + "<small>ID " + it.id + " · " + it.model + "</small>";
        if (j === idx) li.className = "active";
        li.onclick = (function (n) {
          return function () { idx = n; render(); };
        })(j);
        list.appendChild(li);
      }
    }

    document.getElementById("tabBtn").onclick = function () {
      cat = (cat + 1) % SLRP_CATS.length;
      idx = 0;
      render();
    };

    document.getElementById("confirm").onclick = function () {
      var item = current();
      try { sessionStorage.removeItem("slrp_new_account"); } catch (e) {}
      document.body.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
        'font-family:Inter,sans-serif;background:#1a1008;color:#fff;text-align:center;padding:24px">' +
        '<div style="max-width:420px;border:2px solid #e63946;border-radius:8px;padding:36px">' +
        '<p style="color:#e63946;font-family:Bebas Neue,sans-serif;font-size:1.2rem;letter-spacing:.15em">SPAWN</p>' +
        '<h1 style="margin:12px 0">Bem-vindo, ' + acc + '</h1>' +
        '<p style="color:#aaa">Roupa: ' + item.name + '</p>' +
        '<p style="color:#888;font-size:13px">Skin ID ' + item.id + ' (' + item.model + ')</p>' +
        '<p style="color:#ccc;margin-top:12px">Voce apareceu no spawn do mapa.</p></div></div>';
    };

    document.onkeydown = function (e) {
      var c = SLRP_CATS[cat];
      if (e.key === "ArrowUp") { idx = (idx - 1 + c.items.length) % c.items.length; render(); }
      if (e.key === "ArrowDown") { idx = (idx + 1) % c.items.length; render(); }
      if (e.key === "Tab") { e.preventDefault(); cat = (cat + 1) % SLRP_CATS.length; idx = 0; render(); }
    };

    render();
  })();
  </script>
</body>
</html>
