<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja de Roupas - Sao Luis RP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #fff; background: #111; }
    .scene {
      position: fixed; inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.7), rgba(0,0,0,.35)), #1a1008 center/cover no-repeat;
      background-size: cover; background-position: center;
    }
    .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 8px; background: rgba(26,58,26,.92); font-size: 12px; text-align: center; }
    .binco { position: absolute; left: 28px; top: 56px; background: #f5a623; padding: 8px 20px; font-weight: 800; font-size: 18px; z-index: 5; }
    .panel { position: absolute; left: 26px; top: 96px; width: 220px; background: rgba(0,0,0,.88); padding: 10px 0; z-index: 5; border: 1px solid rgba(245,166,35,.35); }
    .panel h2 { font-size: 11px; padding: 0 12px 8px; letter-spacing: .08em; display: flex; justify-content: space-between; }
    .cat { padding: 4px 12px 8px; font-size: 10px; color: #f5a623; }
    .list li { padding: 8px 12px; font-size: 13px; color: #aaa; cursor: pointer; list-style: none; }
    .list li.active { background: #fff; color: #000; font-weight: 700; }
    .list li:hover:not(.active) { background: rgba(255,255,255,.08); color: #fff; }
    .tab { margin: 10px 12px 0; width: calc(100% - 24px); padding: 8px; border: 1px solid #f5a623; background: 0; color: #f5a623; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 11px; }
    .preview-box {
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      width: 320px; padding: 20px; background: rgba(0,0,0,.88); border: 2px solid #f5a623;
      border-radius: 10px; text-align: center; z-index: 5;
    }
    .preview-box .lbl { font-size: 11px; color: #f5a623; letter-spacing: .1em; margin-bottom: 6px; }
    .preview-box .name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .preview-box .id { font-size: 13px; color: #aaa; margin-bottom: 12px; }
    .outfit-photo-wrap {
      width: 100%; height: 300px; margin: 0 auto 12px;
      background: rgba(20,20,20,.9); border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
    }
    .outfit-photo-wrap img {
      width: 100%; height: 100%; object-fit: contain; object-position: center bottom;
      opacity: 0; transition: opacity .3s;
    }
    .outfit-photo-wrap img.show { opacity: 1; }
    .outfit-photo-wrap .loading { color: #888; font-size: 12px; position: absolute; }
    .photo-hint { font-size: 10px; color: #888; margin-bottom: 12px; line-height: 1.4; }
    .confirm { width: 100%; padding: 12px; background: #4cd964; border: 0; color: #000; font-weight: 700; cursor: pointer; font-family: inherit; border-radius: 6px; }
    .hints { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; z-index: 5; }
  </style>
</head>
<body>
  <div class="top" id="topBar">Loja de roupas</div>
  <div class="scene" id="scene"></div>
  <div class="binco">binco</div>
  <div class="panel">
    <h2>ROUPAS: ESCOLHA <span id="counter">1/12</span></h2>
    <div class="cat" id="catName">Categoria: CASUAL M</div>
    <ul class="list" id="list"></ul>
    <button type="button" class="tab" id="tabBtn">TAB Categoria</button>
  </div>
  <div class="preview-box">
    <div class="lbl">PREVIEW DA ROUPA</div>
    <div class="name" id="selName">CJ Padrao</div>
    <div class="id" id="selId">ID da skin: 26</div>
    <div class="outfit-photo-wrap" id="photoWrap">
      <span class="loading" id="photoLoad">Carregando foto...</span>
      <img id="outfitImg" alt="Preview da roupa" referrerpolicy="no-referrer" crossorigin="anonymous">
    </div>
    <p class="photo-hint" id="photoHint"></p>
    <button type="button" class="confirm" id="confirm">X Confirmar</button>
  </div>
  <p class="hints">Setas: trocar | TAB: categoria | Sua foto: img/roupas/nome.jpg</p>

  <script>
  (function () {
    var SLRP_CATS = [
      { n: "CASUAL M", s: [26,29,60,72,73,88,97,98,142,170,186,220],
        l: ["CJ Padrao","Motorista","Fazendeiro","Skin_072","Skin_073","Negociante","Mendigo","Skin_098","Skin_142","Skin_170","Skin_186","Skin_220"] },
      { n: "RUA / RP", s: [28,30,31,33,34,35,36,37,43,44,45,46],
        l: ["Skin_028","Skin_030","Skin_031","Skin_033","Skin_034","Skin_035","Skin_036","Skin_037","Skin_043","Skin_044","Skin_045","Skin_046"] },
      { n: "FEMININO", s: [55,56,57,58,59,60,61,62,63,64,69],
        l: ["Mulher_01","Mulher_02","Mulher_03","Mulher_04","Mulher_05","Mulher_Casual","Mulher_07","Mulher_08","Mulher_09","Mulher_10","Mulher_11"] },
      { n: "TRABALHO", s: [16,61,62,68,70,71,147,148,149],
        l: ["Lixeiro","Policia","FBI","Mecanico","Fazendeiro_Trabalho","Skin_071","Skin_147","Skin_148","Skin_149"] }
    ];

    function slug(label) {
      return String(label || "").toLowerCase()
        .replace(/[àáâãäå]/g,"a").replace(/[èéêë]/g,"e").replace(/[ìíîï]/g,"i")
        .replace(/[òóôõö]/g,"o").replace(/[ùúûü]/g,"u").replace(/ç/g,"c")
        .replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
    }

    function outfitUrls(skinId, label) {
      var s = slug(label), id = parseInt(skinId, 10) || 0, list = [];
      if (s) {
        list.push("img/roupas/" + s + ".jpg", "img/roupas/" + s + ".png", "img/roupas/" + s + ".webp");
      }
      list.push("img/roupas/skin_" + id + ".jpg", "img/roupas/skin_" + id + ".png");
      list.push("https://assets.open.mp/assets/images/skins/" + id + ".png");
      return list;
    }

    var loadToken = 0;
    function loadOutfitImage(skinId, label) {
      var urls = outfitUrls(skinId, label);
      var img = document.getElementById("outfitImg");
      var loadTxt = document.getElementById("photoLoad");
      var token = ++loadToken;
      var i = 0;

      img.classList.remove("show");
      loadTxt.style.display = "block";
      loadTxt.textContent = "Carregando foto...";

      function tryNext() {
        if (token !== loadToken) return;
        if (i >= urls.length) {
          loadTxt.textContent = "Sem foto (adicione img/roupas/" + slug(label) + ".jpg)";
          loadTxt.style.display = "block";
          img.removeAttribute("src");
          img.classList.remove("show");
          return;
        }
        var url = urls[i++];
        var probe = new Image();
        probe.referrerPolicy = "no-referrer";
        probe.onload = function () {
          if (token !== loadToken) return;
          img.src = url;
          img.classList.add("show");
          loadTxt.style.display = "none";
        };
        probe.onerror = tryNext;
        probe.src = url;
      }
      tryNext();
    }

    function setSceneBanner(scene, src) {
      scene.style.backgroundImage =
        "linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.3)), url('" + String(src).replace(/'/g, "%27") + "')";
      scene.style.backgroundSize = "cover";
      scene.style.backgroundPosition = "center";
    }

    function applyBanner() {
      var scene = document.getElementById("scene");
      var exts = [".png", ".jpg", ".jpeg", ".webp"];
      var ei = 0;
      function tryDisk() {
        if (ei >= exts.length) {
          var saved = null;
          try { saved = localStorage.getItem("slrp_banner_v1"); } catch (e) {}
          if (saved) setSceneBanner(scene, saved);
          return;
        }
        var url = "img/banner" + exts[ei++];
        var t = new Image();
        t.onload = function () { setSceneBanner(scene, url); };
        t.onerror = tryDisk;
        t.src = url;
      }
      tryDisk();
    }

    var acc = null;
    try { acc = sessionStorage.getItem("slrp_new_account"); } catch (e) {}
    if (!acc) {
      window.location.replace("saoluis-login.html");
      return;
    }
    document.getElementById("topBar").textContent = "Escolha sua roupa, " + acc;
    applyBanner();

    var cat = 0, idx = 0;

    function render() {
      var c = SLRP_CATS[cat];
      document.getElementById("catName").textContent = "Categoria: " + c.n;
      document.getElementById("counter").textContent = (idx + 1) + "/" + c.s.length;
      document.getElementById("selName").textContent = c.l[idx];
      document.getElementById("selId").textContent = "ID da skin: " + c.s[idx];
      document.getElementById("photoHint").textContent =
        "Sua foto: img/roupas/" + slug(c.l[idx]) + ".jpg  |  Ou usa preview da skin " + c.s[idx];

      loadOutfitImage(c.s[idx], c.l[idx]);

      var list = document.getElementById("list");
      list.innerHTML = "";
      var start = Math.max(0, idx - 2), end = Math.min(c.s.length, start + 5);
      if (end - start < 5) start = Math.max(0, end - 5);
      for (var j = start; j < end; j++) {
        var li = document.createElement("li");
        li.textContent = (j === idx ? "> " : "") + c.l[j];
        if (j === idx) li.className = "active";
        li.onclick = (function (n) { return function () { idx = n; render(); }; })(j);
        list.appendChild(li);
      }
    }

    document.getElementById("tabBtn").onclick = function () {
      cat = (cat + 1) % SLRP_CATS.length;
      idx = 0;
      render();
    };

    document.getElementById("confirm").onclick = function () {
      var roupa = SLRP_CATS[cat].l[idx];
      var skin = SLRP_CATS[cat].s[idx];
      try { sessionStorage.removeItem("slrp_new_account"); } catch (e) {}
      document.body.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;background:#0d0520;color:#fff;text-align:center;padding:24px">' +
        '<div style="max-width:400px;border:1px solid #ff8c00;border-radius:12px;padding:32px">' +
        '<p style="color:#ff8c00;font-size:11px;letter-spacing:.2em">SPAWN</p>' +
        '<h1 style="margin:12px 0">Bem-vindo, ' + acc + '</h1>' +
        '<p style="color:#aaa">Roupa: ' + roupa + ' (skin ' + skin + ')</p>' +
        '<p style="color:#ccc;margin-top:8px">Voce apareceu no spawn do mapa.</p></div></div>';
    };

    document.onkeydown = function (e) {
      var c = SLRP_CATS[cat];
      if (e.key === "ArrowUp") { idx = (idx - 1 + c.s.length) % c.s.length; render(); }
      if (e.key === "ArrowDown") { idx = (idx + 1) % c.s.length; render(); }
      if (e.key === "Tab") { e.preventDefault(); cat = (cat + 1) % SLRP_CATS.length; idx = 0; render(); }
    };

    render();
  })();
  </script>
</body>
</html>
